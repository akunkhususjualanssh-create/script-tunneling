    keepalive_timeout 86400000m;
    server_name xxx;
    location ~ /vless-grpc {
        proxy_http_version 1.1;
        proxy_redirect off;
        grpc_set_header Host $host;
        grpc_pass grpc://127.0.0.1:10005;
        grpc_set_header X-Real-IP $http_x_forwarded_for;
