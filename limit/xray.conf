server {
    listen 1010 default_server proxy_protocol so_keepalive=on reuseport;
    set_real_ip_from 127.0.0.1;
    real_ip_header  proxy_protocol;
    server_name _;
    client_body_buffer_size 200K;
    client_header_buffer_size 2k;
    client_max_body_size 10M;
    large_client_header_buffers 3 1k;
    client_header_timeout 86400000m;
    keepalive_timeout 86400000m;
    add_header X-HTTP-LEVEL-HEADER 1;
    add_header X-ANOTHER-HTTP-LEVEL-HEADER 1;
    add_header X-XSS-Protection "1; mode=block";

    location ~ /vless {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    location ~ /vmess {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10002;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    } 
    location ~ /trojan-ws {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10003;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    location ~ /ss-ws {
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10004;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
    # Static Web Files (Backup zip, SSH txt, configs)
    location ~* \.(zip|txt|html|conf|ovpn|json)$ {
        root /var/www/html;
    }

    # Universal SSH WebSocket Handler (Supports ALL Payloads)
    location / {
        set $ws_upgrade "websocket";
        if ($http_upgrade != "") {
            set $ws_upgrade $http_upgrade;
        }
        proxy_headers_hash_max_size 512;
        proxy_headers_hash_bucket_size 128;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_pass http://127.0.0.1:10015;
        proxy_set_header Upgrade $ws_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
    }
}
